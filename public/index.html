<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="same-origin" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YallaFix — Your Phone, Fixed. At Your Doorstep.</title>
    <meta
      name="description"
      content="On-demand mobile phone repair in under 60 minutes. Certified technicians come to you. No shop visits, no hassle."
    />
    <link rel="canonical" href="https://yallafixsy.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      #airo-boot-spinner {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0e1520;
        color: #e1e5f2;
        font-family:
          "Alexandria",
          -apple-system,
          sans-serif;
        opacity: 0;
        pointer-events: none;
        animation: airo-boot-fade 0.2s ease 1s forwards;
      }
      #app:not(:empty) ~ #airo-boot-spinner {
        display: none;
      }
      .airo-boot-ring {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(161, 248, 127, 0.2);
        border-top-color: #a0f87f;
        border-radius: 50%;
        animation: airo-boot-spin 0.9s linear infinite;
      }
      .airo-boot-text,
      .airo-boot-slow-text {
        margin: 0;
        font-size: 14px;
      }
      .airo-boot-slow-text {
        display: none;
      }
      #airo-boot-spinner.airo-boot-slow .airo-boot-slow-text {
        display: block;
      }
      @keyframes airo-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes airo-boot-fade {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .airo-boot-ring {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body class="fs-unmask-airo-app-builder">
    <div id="app" class="fs-unmask-airo-app-builder"></div>
    <div id="airo-boot-spinner" role="status" aria-live="polite">
      <div class="airo-boot-ring" aria-hidden="true"></div>
      <p class="airo-boot-text">Loading…</p>
      <p class="airo-boot-slow-text">
        Still working — the first load can take a little longer.
      </p>
    </div>
    <script>
      (function () {
        var spinner = document.getElementById("airo-boot-spinner");
        if (!spinner) return;
        var appEl = document.getElementById("app");
        if (!appEl) {
          spinner.remove();
          return;
        }
        if (appEl.firstElementChild) {
          spinner.remove();
          return;
        }
        var observer = new MutationObserver(function () {
          if (appEl.firstElementChild) {
            observer.disconnect();
            spinner.remove();
          }
        });
        observer.observe(appEl, { childList: true });
        setTimeout(function () {
          spinner.classList.add("airo-boot-slow");
        }, 20000);
        setTimeout(function () {
          observer.disconnect();
          spinner.remove();
        }, 90000);
      })();
    </script>
  </body>
</html>
